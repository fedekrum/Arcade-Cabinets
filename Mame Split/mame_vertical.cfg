<?xml version="1.0"?>
<systemList>
  <system>
    <name>mame_vertical</name>
    <fullname>Mame Vertical</fullname>
    <manufacturer>Arcade</manufacturer>
    <release>1997</release>
    <hardware>arcade</hardware>
    <path>/userdata/roms/mame_vertical</path>
    <extension>.zip .ZIP .7z .7Z .chd .CHD</extension>
    <command>batocera-launch %CONTROLLERSCONFIG% -system mame -emulator libretro -core mame -rom "%ROM%"</command>
    <platform>arcade</platform>
    <theme>mame</theme>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core default="true">mame</core>
          <core>mame078plus</core>
        </cores>
      </emulator>
      <emulator name="mame">
        <cores>
          <core>mame</core>
        </cores>
      </emulator>
    </emulators>
  </system>
</systemList>
